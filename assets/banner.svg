<svg xmlns="http://www.w3.org/2000/svg" width="960" height="336" viewBox="0 0 960 336" role="img" aria-labelledby="title description">
  <title id="title">Kaixuan (Kaius) Jin — terminal profile</title>
  <desc id="description">Kaius studies Computer Science at the University of Waterloo. Interests: Backend Development; LLM Inference &amp; Serving; Deep Learning &amp; Neural Network Architectures. Portfolio: kaiusjin.com. LinkedIn: linkedin.com/in/kaixuan-jin. Email: k39jin@uwaterloo.ca.</desc>
  <defs>
    <clipPath id="window">
      <rect width="960" height="336" rx="10"/>
    </clipPath>
  </defs>
  <style>
    svg { --body: #fcfcff; --bar: #e7e5f0; --footer: #eeedf5; --text: #303543; --muted: #626078; --chrome: #666277; --user: #7541b4; --path: #24704a; --heading: #8b6100; --link: #086b9f; }
    @media (prefers-color-scheme: dark) {
      svg { --body: #09181d; --bar: #1c1c2e; --footer: #191b2a; --text: #dce4ec; --muted: #9291ab; --chrome: #9693ad; --user: #b89aff; --path: #8bd5a0; --heading: #f5cb5c; --link: #69c5ff; }
    }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 400; }
    .session { font-size: 13px; }
    .window-title { font-size: 10px; letter-spacing: 1.4px; }
    .status { font-size: 9px; }
  </style>
  <g clip-path="url(#window)">
    <rect width="960" height="336" fill="var(--body)"/>
    <rect width="960" height="32" fill="var(--bar)"/>
    <rect y="318" width="960" height="18" fill="var(--footer)"/>
  </g>
  <circle cx="26" cy="16" r="5" fill="#ff6058"/>
  <circle cx="45" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="64" cy="16" r="5" fill="#28c840"/>
  <text x="480" y="19" text-anchor="middle" class="window-title" fill="var(--chrome)">~/kaius — zsh</text>
  <g class="session" fill="var(--text)" xml:space="preserve">
    <text x="26" y="58"><tspan fill="var(--user)">kaius@github</tspan><tspan fill="var(--path)"> ~</tspan><tspan> $ </tspan><tspan>whoami --verbose</tspan></text>
    <text x="26" y="78">↳ Kaixuan (Kaius) Jin · CS @ University of Waterloo</text>
    <text x="26" y="108"><tspan fill="var(--user)">kaius@github</tspan><tspan fill="var(--path)"> ~</tspan><tspan> $ </tspan><tspan>cat interests.md</tspan></text>
    <text x="26" y="126" fill="var(--heading)">## interests</text>
    <text x="26" y="144">- Backend Development</text>
    <text x="26" y="162">- LLM Inference &amp; Serving</text>
    <text x="26" y="180">- Deep Learning &amp; Neural Network Architectures</text>
    <text x="26" y="210"><tspan fill="var(--user)">kaius@github</tspan><tspan fill="var(--path)"> ~</tspan><tspan> $ </tspan><tspan>contact --all</tspan></text>
    <text x="26" y="230"><tspan fill="var(--muted)">Portfolio</tspan><tspan x="116" fill="var(--link)">kaiusjin.com</tspan></text>
    <text x="26" y="250"><tspan fill="var(--muted)">LinkedIn</tspan><tspan x="116" fill="var(--link)">linkedin.com/in/kaixuan-jin</tspan></text>
    <text x="26" y="270"><tspan fill="var(--muted)">Email</tspan><tspan x="116" fill="var(--link)">k39jin@uwaterloo.ca</tspan></text>
    <text x="26" y="302"><tspan fill="var(--user)">kaius@github</tspan><tspan fill="var(--path)"> ~</tspan><tspan> $ </tspan><tspan fill="var(--muted)">▍</tspan></text>
  </g>
  <text x="26" y="330" class="status" fill="var(--chrome)" xml:space="preserve">UTF-8     zsh     ctrl-l · clear</text>
</svg>
