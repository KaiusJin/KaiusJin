  <text x="28" y="66" class="command"><tspan fill="#7ac4a5">$ </tspan><tspan fill="#9da7b3">whoami</tspan><tspan fill="#7ac4a5"> ▍</tspan></text>
  <text x="28" y="110" class="name" fill="#f0f6fc">Kaixuan (Kaius) Jin</text>
  <text x="28" y="149" class="focus" fill="#9da7b3"><tspan class="full">Backend systems · Cloud infrastructure · AI engineering</tspan><tspan class="compact">Backend / Cloud / AI</tspan></text>
