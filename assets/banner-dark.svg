<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-labelledby="title description">
  <title id="title">Kaixuan (Kaius) Jin</title>
  <desc id="description">A minimal terminal profile. Backend systems, cloud infrastructure, and AI engineering.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
