    .command { font-size: 15px; }
    .name { font-size: 32px; font-weight: 600; letter-spacing: -1px; }
    .focus { font-size: 16px; }
    .compact { display: none; }
    @media (max-width: 600px) {
      .window-title { font-size: 22px; }
